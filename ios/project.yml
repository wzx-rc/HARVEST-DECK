name: HarvestDesk
options:
  bundleIdPrefix: com.wzx
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HarvestDesk:
    type: application
    platform: iOS
    sources:
      - path: HarvestDesk
        excludes: ["Resources/Fonts/**", "*.entitlements", "Info.plist"]
      - path: HarvestDesk/Resources/Fonts
        type: folder
        buildPhase: resources
      - Shared
      - HarvestWidget/WidgetViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wzx.harvestdesk
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: HarvestDesk/HarvestDesk.entitlements
    info:
      path: HarvestDesk/Info.plist
      properties:
        CFBundleDisplayName: Harvest Desk
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [Fonts/BricolageGrotesque-SemiBold.ttf, Fonts/BricolageGrotesque-Bold.ttf, Fonts/InstrumentSans-Regular.ttf, Fonts/InstrumentSans-SemiBold.ttf]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: HarvestWidget
  HarvestWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HarvestWidget
        excludes: ["*.entitlements", "Info.plist"]
      - Shared
      - path: HarvestDesk/Resources/Fonts
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wzx.harvestdesk.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: HarvestWidget/HarvestWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: HarvestWidget/Info.plist
      properties:
        CFBundleDisplayName: Harvest Desk
        CFBundleDevelopmentRegion: fr
        UIAppFonts: [Fonts/BricolageGrotesque-SemiBold.ttf, Fonts/BricolageGrotesque-Bold.ttf, Fonts/InstrumentSans-Regular.ttf, Fonts/InstrumentSans-SemiBold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
